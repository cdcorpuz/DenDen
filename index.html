<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d28d9">

  <title>DenDen Music Generator</title>

  <link rel="manifest" href="manifest.json">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #261447;

      /* BACKGROUND PHOTO */
      background:
        linear-gradient(
          rgba(248,245,255,0.84),
          rgba(248,245,255,0.84)
        ),
        url("background.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* HEADER */

    header {
      background: rgba(91,33,182,0.90);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      color: white;
      padding: 24px 16px;
      text-align: center;

      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .92;
      font-size: 14px;
    }


    /* MAIN */

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }


    /* CARDS */

    .card {
      background: rgba(255,255,255,0.90);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      border: 1px solid rgba(255,255,255,.65);

      border-radius: 18px;

      padding: 20px;
      margin-bottom: 18px;

      box-shadow:
        0 5px 20px rgba(38,20,71,.10);
    }

    .card h2 {
      margin-top: 0;
    }


    /* GENERATOR GRID */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));

      gap: 12px;
    }


    /* FORM ELEMENTS */

    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input,
    select,
    button {

      width: 100%;

      padding: 11px;

      border-radius: 10px;

      border: 1px solid #d8b4fe;

      font-size: 14px;
    }

    input,
    select {
      background: rgba(255,255,255,.96);
      color: #261447;
    }

    input:focus,
    select:focus {

      outline: 2px solid #a78bfa;

      border-color: #7c3aed;
    }


    /* BUTTONS */

    button {

      background: #6d28d9;

      color: white;

      border: none;

      font-weight: bold;

      cursor: pointer;

      transition: .15s;
    }

    button:hover {
      background: #5b21b6;
    }

    button:active {
      transform: scale(.99);
    }

    .secondary {

      background: #ede9fe;

      color: #5b21b6;
    }

    .secondary:hover {

      background: #ddd6fe;

    }


    /* CHECKBOXES */

    .checkbox-area {

      margin-top: 15px;

      display: flex;

      flex-wrap: wrap;

      gap: 15px;
    }

    .checkbox-area label {

      display: flex;

      align-items: center;

      gap: 6px;

      font-size: 13px;

      cursor: pointer;
    }

    .checkbox-area input {

      width: auto;

      margin: 0;
    }


    /* STATS */

    .stats {

      margin-top: 12px;

      font-size: 13px;

      color: #6b7280;

      text-align: center;
    }


    /* SONG ROW */

    .song {

      padding: 11px 4px;

      border-bottom:
        1px solid rgba(109,40,217,.10);
    }

    .song:last-child {
      border-bottom: none;
    }

    .song-title {

      font-weight: bold;

      line-height: 1.35;
    }

    .song-info {

      font-size: 12px;

      color: #6b7280;

      margin-top: 3px;

      line-height: 1.4;
    }


    /* ACT HEADER */

    .act {

      margin-top: 22px;

      padding: 10px;

      background:
        linear-gradient(
          135deg,
          rgba(237,233,254,.96),
          rgba(221,214,254,.96)
        );

      border-radius: 10px;

      font-weight: bold;

      text-align: center;

      color: #5b21b6;
    }


    /* ACTION BUTTONS */

    .actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 15px;

      margin-bottom: 10px;
    }


    /* SEARCH RESULTS */

    #searchResults {

      max-height: 600px;

      overflow-y: auto;

      margin-top: 10px;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      body {

        /*
          Fixed backgrounds can behave oddly on iPhone Safari.
          Scroll is smoother and more reliable.
        */

        background-attachment: scroll;
      }

      header {

        padding: 20px 12px;
      }

      header h1 {

        font-size: 23px;
      }

      .container {

        padding: 10px;
      }

      .card {

        padding: 15px;

        border-radius: 15px;
      }

      .grid {

        grid-template-columns:
          repeat(2,1fr);
      }

      .actions {

        grid-template-columns: 1fr 1fr;
      }

    }


    @media (max-width: 400px) {

      .grid {

        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


<header>

  <h1>🎵 DenDen Music Generator</h1>

  <p id="libraryCount">
    Loading music library...
  </p>

</header>



<div class="container">


  <!-- GENERATOR -->

  <div class="card">

    <h2>🎲 Song Generator</h2>


    <div class="grid">


      <div>

        <label>NUMBER OF SONGS</label>

        <input
          id="number"
          type="number"
          value="30"
          min="1"
          max="100"
        >

      </div>



      <div>

        <label>CATEGORY</label>

        <select id="category">

          <option value="">
            All Categories
          </option>

          <option value="FIL">
            Filipino / OPM
          </option>

          <option value="NON-FIL">
            English / International
          </option>

        </select>

      </div>



      <div>

        <label>ARTIST</label>

        <select id="artist">

          <option value="">
            All Artists
          </option>

        </select>

      </div>



      <div>

        <label>RECOGNITION</label>

        <select id="tier">

          <option value="">
            All Tiers
          </option>

        </select>

      </div>



      <div>

        <label>PERFORMANCE TAG</label>

        <select id="tag">

          <option value="">
            All Tags
          </option>

        </select>

      </div>



      <div>

        <label>MINIMUM SPEED</label>

        <select id="minSpeed"></select>

      </div>



      <div>

        <label>MAXIMUM SPEED</label>

        <select id="maxSpeed"></select>

      </div>


    </div>



    <div class="checkbox-area">

      <label>

        <input
          id="uniqueArtist"
          type="checkbox"
        >

        Avoid repeating the same artist

      </label>


      <label>

        <input
          id="threeActs"
          type="checkbox"
          checked
        >

        Split lineup into 3 Acts

      </label>

    </div>



    <button
      onclick="generate()"
      style="margin-top:15px;"
    >

      🎲 GENERATE SONGS

    </button>


    <div
      class="stats"
      id="poolCount">
    </div>


  </div>



  <!-- SEARCH -->

  <div class="card">

    <h2>🔎 Search Library</h2>

    <input
      id="search"
      placeholder="Search song or artist..."
      oninput="searchLibrary()"
    >

    <div id="searchResults"></div>

  </div>



  <!-- LINEUP -->

  <div class="card">

    <h2>🎤 Generated Lineup</h2>


    <div class="actions">

      <button
        class="secondary"
        onclick="generate()"
      >

        ↻ Regenerate

      </button>


      <button
        class="secondary"
        onclick="copyList()"
      >

        📋 Copy List

      </button>

    </div>


    <div id="results"></div>

  </div>


</div>



<script>


let songs = [];

let currentLineup = [];



/* =========================
   LOAD MUSIC LIBRARY
========================= */


fetch("songs.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "songs.json not found"
      );

    }

    return response.json();

  })

  .then(data => {


    songs = data;


    document
      .getElementById("libraryCount")
      .textContent =

      songs.length.toLocaleString()

      + " songs in the DenDen Music Library";


    buildFilters();

    updatePool();


  })

  .catch(error => {


    document
      .getElementById("libraryCount")
      .textContent =

      "Music library could not be loaded.";


    console.error(error);


  });



/* =========================
   BUILD FILTERS
========================= */


function buildFilters() {


  const artists =

    [...new Set(

      songs

        .map(song => song.artist)

        .filter(Boolean)

    )]

    .sort(
      (a,b) =>
        a.localeCompare(b)
    );



  const tiers =

    [...new Set(

      songs

        .map(song => song.tier)

        .filter(Boolean)

    )];



  const tags = new Set();



  songs.forEach(song => {


    if (!song.tag) return;


    song.tag

      .split("+")

      .forEach(tag => {

        tags.add(
          tag.trim()
        );

      });


  });



  const artistSelect =
    document.getElementById("artist");


  artists.forEach(artist => {


    const option =
      document.createElement("option");


    option.value =
      artist;


    option.textContent =
      artist;


    artistSelect
      .appendChild(option);


  });



  const tierSelect =
    document.getElementById("tier");


  tiers.forEach(tier => {


    const option =
      document.createElement("option");


    option.value =
      tier;


    option.textContent =
      tier;


    tierSelect
      .appendChild(option);


  });



  const tagSelect =
    document.getElementById("tag");


  [...tags]

    .sort()

    .forEach(tag => {


      const option =
        document.createElement("option");


      option.value =
        tag;


      option.textContent =
        tag;


      tagSelect
        .appendChild(option);


    });



  const min =
    document.getElementById("minSpeed");


  const max =
    document.getElementById("maxSpeed");



  for (
    let i = 0;
    i <= 10;
    i++
  ) {


    min.innerHTML +=

      `<option value="${i}">
        ${i}
      </option>`;


    max.innerHTML +=

      `<option value="${i}">
        ${i}
      </option>`;


  }



  min.value = 0;

  max.value = 10;



  document

    .querySelectorAll("select")

    .forEach(element => {


      element.addEventListener(
        "change",
        updatePool
      );


    });


}



/* =========================
   FILTER SONGS
========================= */


function getFilteredSongs() {


  const category =
    document
      .getElementById("category")
      .value;


  const artist =
    document
      .getElementById("artist")
      .value;


  const tier =
    document
      .getElementById("tier")
      .value;


  const tag =
    document
      .getElementById("tag")
      .value;


  const min =
    Number(
      document
        .getElementById("minSpeed")
        .value
    );


  const max =
    Number(
      document
        .getElementById("maxSpeed")
        .value
    );



  return songs.filter(song => {


    if (
      category &&
      song.category !== category
    )
      return false;



    if (
      artist &&
      song.artist !== artist
    )
      return false;



    if (
      tier &&
      song.tier !== tier
    )
      return false;



    if (

      tag &&

      !(song.tag || "")

        .split("+")

        .map(x => x.trim())

        .includes(tag)

    )

      return false;



    if (

      song.speed !== null &&

      song.speed !== undefined &&

      (

        song.speed < min ||

        song.speed > max

      )

    )

      return false;



    return true;


  });


}



/* =========================
   UPDATE POOL
========================= */


function updatePool() {


  const pool =
    getFilteredSongs();


  document
    .getElementById("poolCount")
    .textContent =

    "Available pool: "

    + pool.length.toLocaleString()

    + " songs";


}



/* =========================
   SHUFFLE
========================= */


function shuffle(array) {


  const copy =
    [...array];


  for (

    let i =
      copy.length - 1;

    i > 0;

    i--

  ) {


    const j =

      Math.floor(

        Math.random()
        * (i + 1)

      );


    [

      copy[i],

      copy[j]

    ] = [

      copy[j],

      copy[i]

    ];


  }


  return copy;


}



/* =========================
   GENERATE LINEUP
========================= */


function generate() {


  const wanted =

    Number(

      document
        .getElementById("number")
        .value

    );


  const uniqueArtist =

    document
      .getElementById("uniqueArtist")
      .checked;



  let pool =

    shuffle(

      getFilteredSongs()

    );



  let chosen = [];


  let usedArtists =
    new Set();



  for (
    const song of pool
  ) {


    if (

      uniqueArtist &&

      usedArtists.has(
        song.artist
      )

    )

      continue;



    chosen.push(song);


    usedArtists.add(
      song.artist
    );



    if (
      chosen.length >= wanted
    )

      break;


  }



  currentLineup =
    chosen;


  displayLineup();


}



/* =========================
   DISPLAY LINEUP
========================= */


function displayLineup() {


  const results =

    document
      .getElementById("results");


  results.innerHTML = "";



  if (
    !currentLineup.length
  ) {


    results.innerHTML =

      "<p>No songs match your filters.</p>";


    return;


  }



  const threeActs =

    document
      .getElementById("threeActs")
      .checked;



  const actSize =

    Math.ceil(

      currentLineup.length / 3

    );



  currentLineup

    .forEach(

      (song,index) => {


        if (

          threeActs &&

          index % actSize === 0

        ) {


          const act =

            Math.floor(

              index / actSize

            ) + 1;


          results.innerHTML +=

            `<div class="act">
              ACT ${act}
            </div>`;


        }



        results.innerHTML += `

          <div class="song">

            <div class="song-title">

              ${index + 1}.
              ${song.song}

            </div>


            <div class="song-info">

              ${song.artist || ""}

              ${
                song.year
                  ? " · " + song.year
                  : ""
              }

              ${
                song.speed !== null &&
                song.speed !== undefined

                  ? " · Speed "
                    + song.speed

                  : ""
              }

              ${
                song.tier

                  ? " · "
                    + song.tier

                  : ""
              }

              ${
                song.tag

                  ? " · "
                    + song.tag

                  : ""
              }

            </div>

          </div>

        `;


      }

    );


}



/* =========================
   SEARCH LIBRARY
========================= */


function searchLibrary() {


  const query =

    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();



  const output =

    document
      .getElementById("searchResults");


  output.innerHTML = "";



  if (!query)
    return;



  const matches =

    songs

      .filter(song => {


        const songName =

          (song.song || "")
            .toLowerCase();


        const artistName =

          (song.artist || "")
            .toLowerCase();


        return (

          songName.includes(query)

          ||

          artistName.includes(query)

        );


      })

      .slice(0,100);



  matches.forEach(song => {


    output.innerHTML += `

      <div class="song">

        <div class="song-title">

          ${song.song}

        </div>


        <div class="song-info">

          ${song.artist || ""}

          ${
            song.year
              ? " · " + song.year
              : ""
          }

          ${
            song.speed !== null &&
            song.speed !== undefined

              ? " · Speed "
                + song.speed

              : ""
          }

          ${
            song.tier

              ? " · "
                + song.tier

              : ""
          }

          ${
            song.tag

              ? " · "
                + song.tag

              : ""
          }

        </div>

      </div>

    `;


  });


}



/* =========================
   COPY LINEUP
========================= */


function copyList() {


  if (
    !currentLineup.length
  )

    return;



  const text =

    currentLineup

      .map(

        (song,index) =>

          `${index + 1}. ${song.song} — ${song.artist}`

      )

      .join("\n");



  navigator
    .clipboard
    .writeText(text)

    .then(() => {

      alert(
        "Lineup copied!"
      );

    })

    .catch(() => {

      alert(
        "Unable to copy lineup."
      );

    });


}



/* =========================
   SERVICE WORKER
========================= */


if (
  "serviceWorker"
  in navigator
) {


  window.addEventListener(

    "load",

    () => {


      navigator
        .serviceWorker
        .register("sw.js")

        .catch(error => {

          console.log(
            "Service worker:",
            error
          );

        });


    }

  );


}


</script>


</body>

</html>
