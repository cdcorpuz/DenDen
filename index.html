<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6d28d9">

  <title>DenDen Music Generator</title>

  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --purple: #6d28d9;
      --purple-dark: #4c1d95;
      --purple-soft: #ede9fe;
      --ink: #24143f;
      --muted: #6b7280;
      --page: #f7f4ff;
      --card: #ffffff;
      --border: #ddd6fe;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--page);
    }

    /* =========================
       HERO PHOTO
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: 360px;
      overflow: hidden;
      background: #201038;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.03) 10%,
        rgba(24,8,48,0.10) 55%,
        rgba(24,8,48,0.78) 100%
      );

      pointer-events: none;
    }

    .hero-copy {
      position: absolute;
      z-index: 2;

      left: 0;
      right: 0;
      bottom: 0;

      padding: 35px 18px 28px;

      text-align: center;
      color: white;
    }

    .hero-copy h1 {
      margin: 0;

      font-size: clamp(
        28px,
        5vw,
        46px
      );

      letter-spacing: -0.5px;

      text-shadow:
        0 2px 15px
        rgba(0,0,0,0.35);
    }

    .hero-copy p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.94;
    }

    /* =========================
       MAIN PAGE
    ========================= */

    .container {
      max-width: 1080px;

      margin: -18px auto 0;

      padding:
        0 18px 28px;

      position: relative;
      z-index: 3;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: var(--card);

      border:
        1px solid
        rgba(221,214,254,0.9);

      border-radius: 20px;

      padding: 20px;

      margin-bottom: 18px;

      box-shadow:
        0 12px 35px
        rgba(76,29,149,0.09);
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    /* =========================
       GENERATOR GRID
    ========================= */

    .grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px,1fr)
        );

      gap: 12px;
    }

    /* =========================
       FORM
    ========================= */

    label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;
      font-weight: 700;

      color: #4b3a67;
    }

    input,
    select,
    button {
      width: 100%;

      border-radius: 12px;

      font-size: 14px;
    }

    input,
    select {
      padding: 11px 12px;

      border:
        1px solid
        var(--border);

      background: white;

      color: var(--ink);
    }

    input:focus,
    select:focus {
      outline:
        2px solid
        #c4b5fd;

      border-color:
        var(--purple);
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      border: 0;

      padding: 12px 14px;

      background:
        var(--purple);

      color: white;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .12s ease,
        background .12s ease;
    }

    button:hover {
      background:
        var(--purple-dark);
    }

    button:active {
      transform:
        scale(.99);
    }

    .secondary {
      background:
        var(--purple-soft);

      color:
        var(--purple-dark);
    }

    .secondary:hover {
      background:
        #ddd6fe;
    }

    .generate-btn {
      margin-top: 16px;

      font-size: 15px;

      padding:
        13px 16px;
    }

    /* =========================
       CHECKBOXES
    ========================= */

    .checkbox-area {
      display: flex;
      flex-wrap: wrap;

      gap: 14px;

      margin:
        15px 0 0;
    }

    .checkbox-area label {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin: 0;

      font-size: 13px;

      cursor: pointer;
    }

    .checkbox-area input {
      width: auto;
      margin: 0;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      margin-top: 10px;

      text-align: center;

      color:
        var(--muted);

      font-size: 13px;
    }

    /* =========================
       SONGS
    ========================= */

    .song {
      padding:
        12px 2px;

      border-bottom:
        1px solid
        #eee9fb;
    }

    .song:last-child {
      border-bottom: 0;
    }

    .song-title {
      font-weight: 700;

      line-height: 1.35;
    }

    .song-info {
      margin-top: 3px;

      font-size: 12px;

      line-height: 1.45;

      color:
        var(--muted);
    }

    /* =========================
       ACTS
    ========================= */

    .act {
      margin-top: 22px;

      padding: 10px;

      text-align: center;

      font-weight: 800;

      color:
        var(--purple-dark);

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #f3e8ff,
          #ede9fe
        );
    }

    /* =========================
       ACTION BUTTONS
    ========================= */

    .actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-bottom: 12px;
    }

    /* =========================
       SEARCH
    ========================= */

    #searchResults {
      max-height: 600px;

      overflow-y: auto;

      margin-top: 10px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      padding:
        2px 10px 24px;

      color:
        #8a8199;

      font-size: 12px;
    }

    /* =========================
       IPHONE / MOBILE
    ========================= */

    @media (max-width: 600px) {

      .hero {
        height: 290px;
      }

      .hero-copy {
        padding:
          28px 14px 24px;
      }

      .container {
        margin-top: -12px;

        padding:
          0 10px 20px;
      }

      .card {
        padding: 15px;

        border-radius: 16px;
      }

      .grid {
        grid-template-columns:
          repeat(2,1fr);
      }
    }

    @media (max-width: 430px) {

      .grid {
        grid-template-columns:
          1fr;
      }

      .actions {
        grid-template-columns:
          1fr 1fr;
      }
    }

  </style>
</head>


<body>

  <!-- =====================
       HERO PHOTO
  ====================== -->

  <section class="hero">

    <img
      src="background.jpg"
      alt="DenDen Music"
    >

    <div class="hero-copy">

      <h1>
        🎵 DenDen Music Generator
      </h1>

      <p id="libraryCount">
        Loading music library...
      </p>

    </div>

  </section>


  <!-- =====================
       MAIN CONTENT
  ====================== -->

  <main class="container">


    <!-- GENERATOR -->

    <section class="card">

      <h2>
        🎲 Song Generator
      </h2>


      <div class="grid">


        <div>

          <label>
            NUMBER OF SONGS
          </label>

          <input
            id="number"
            type="number"
            value="30"
            min="1"
            max="100"
          >

        </div>


        <div>

          <label>
            CATEGORY
          </label>

          <select id="category">

            <option value="">
              All Categories
            </option>

            <option value="FIL">
              Filipino / OPM
            </option>

            <option value="NON-FIL">
              English / International
            </option>

          </select>

        </div>


        <div>

          <label>
            ARTIST
          </label>

          <select id="artist">

            <option value="">
              All Artists
            </option>

          </select>

        </div>


        <div>

          <label>
            RECOGNITION
          </label>

          <select id="tier">

            <option value="">
              All Tiers
            </option>

          </select>

        </div>


        <div>

          <label>
            PERFORMANCE TAG
          </label>

          <select id="tag">

            <option value="">
              All Tags
            </option>

          </select>

        </div>


        <div>

          <label>
            MINIMUM SPEED
          </label>

          <select id="minSpeed">
          </select>

        </div>


        <div>

          <label>
            MAXIMUM SPEED
          </label>

          <select id="maxSpeed">
          </select>

        </div>


      </div>


      <div class="checkbox-area">

        <label>

          <input
            id="uniqueArtist"
            type="checkbox"
          >

          Avoid repeating the same artist

        </label>


        <label>

          <input
            id="threeActs"
            type="checkbox"
            checked
          >

          Split lineup into 3 Acts

        </label>

      </div>


      <button
        class="generate-btn"
        onclick="generate()"
      >

        🎲 GENERATE SONGS

      </button>


      <div
        class="stats"
        id="poolCount">
      </div>

    </section>


    <!-- SEARCH -->

    <section class="card">

      <h2>
        🔎 Search Library
      </h2>


      <input
        id="search"
        placeholder="Search song or artist..."
        oninput="searchLibrary()"
      >


      <div id="searchResults">
      </div>

    </section>


    <!-- GENERATED LINEUP -->

    <section class="card">

      <h2>
        🎤 Generated Lineup
      </h2>


      <div class="actions">


        <button
          class="secondary"
          onclick="generate()"
        >

          ↻ Regenerate

        </button>


        <button
          class="secondary"
          onclick="copyList()"
        >

          📋 Copy List

        </button>


      </div>


      <div id="results">
      </div>

    </section>


  </main>


  <div class="footer">
    DenDen Music Library
  </div>



<script>


let songs = [];

let currentLineup = [];



/* =========================
   LOAD SONGS
========================= */


fetch("songs.json")

  .then(response => {

    if (!response.ok) {

      throw new Error(
        "songs.json not found"
      );

    }

    return response.json();

  })


  .then(data => {

    songs = data;


    document
      .getElementById(
        "libraryCount"
      )
      .textContent =

      songs.length
        .toLocaleString()

      +

      " songs in the DenDen Music Library";


    buildFilters();

    updatePool();

  })


  .catch(error => {

    document
      .getElementById(
        "libraryCount"
      )
      .textContent =

      "Music library could not be loaded.";


    console.error(error);

  });



/* =========================
   BUILD FILTERS
========================= */


function buildFilters() {


  const artists =

    [...new Set(

      songs
        .map(song => song.artist)
        .filter(Boolean)

    )]

    .sort(
      (a,b) =>
        a.localeCompare(b)
    );



  const tiers =

    [...new Set(

      songs
        .map(song => song.tier)
        .filter(Boolean)

    )];



  const tags =
    new Set();



  songs.forEach(song => {


    if (!song.tag)
      return;


    song.tag

      .split("+")

      .forEach(tag => {

        tags.add(
          tag.trim()
        );

      });


  });



  const artistSelect =

    document
      .getElementById(
        "artist"
      );



  artists.forEach(artist => {


    const option =

      document
        .createElement(
          "option"
        );


    option.value =
      artist;


    option.textContent =
      artist;


    artistSelect
      .appendChild(option);


  });



  const tierSelect =

    document
      .getElementById(
        "tier"
      );



  tiers.forEach(tier => {


    const option =

      document
        .createElement(
          "option"
        );


    option.value =
      tier;


    option.textContent =
      tier;


    tierSelect
      .appendChild(option);


  });



  const tagSelect =

    document
      .getElementById(
        "tag"
      );



  [...tags]

    .sort()

    .forEach(tag => {


      const option =

        document
          .createElement(
            "option"
          );


      option.value =
        tag;


      option.textContent =
        tag;


      tagSelect
        .appendChild(option);


    });



  const min =

    document
      .getElementById(
        "minSpeed"
      );


  const max =

    document
      .getElementById(
        "maxSpeed"
      );



  for (
    let i = 0;
    i <= 10;
    i++
  ) {


    min.innerHTML +=

      `<option value="${i}">
        ${i}
      </option>`;


    max.innerHTML +=

      `<option value="${i}">
        ${i}
      </option>`;

  }



  min.value = 0;

  max.value = 10;



  document

    .querySelectorAll(
      "select"
    )

    .forEach(element => {


      element
        .addEventListener(
          "change",
          updatePool
        );


    });


}



/* =========================
   FILTER SONGS
========================= */


function getFilteredSongs() {


  const category =

    document
      .getElementById(
        "category"
      )
      .value;


  const artist =

    document
      .getElementById(
        "artist"
      )
      .value;


  const tier =

    document
      .getElementById(
        "tier"
      )
      .value;


  const tag =

    document
      .getElementById(
        "tag"
      )
      .value;


  const min =

    Number(

      document
        .getElementById(
          "minSpeed"
        )
        .value

    );


  const max =

    Number(

      document
        .getElementById(
          "maxSpeed"
        )
        .value

    );



  return songs.filter(song => {


    if (
      category &&
      song.category !== category
    )

      return false;



    if (
      artist &&
      song.artist !== artist
    )

      return false;



    if (
      tier &&
      song.tier !== tier
    )

      return false;



    if (

      tag &&

      !(song.tag || "")

        .split("+")

        .map(
          x => x.trim()
        )

        .includes(tag)

    )

      return false;



    if (

      song.speed !== null &&

      song.speed !== undefined &&

      (

        song.speed < min ||

        song.speed > max

      )

    )

      return false;



    return true;


  });


}



/* =========================
   UPDATE POOL
========================= */


function updatePool() {


  const pool =
    getFilteredSongs();


  document
    .getElementById(
      "poolCount"
    )
    .textContent =

    "Available pool: "

    +

    pool.length
      .toLocaleString()

    +

    " songs";


}



/* =========================
   SHUFFLE
========================= */


function shuffle(array) {


  const copy =
    [...array];


  for (

    let i =
      copy.length - 1;

    i > 0;

    i--

  ) {


    const j =

      Math.floor(

        Math.random()

        *

        (i + 1)

      );


    [
      copy[i],
      copy[j]
    ]

    =

    [
      copy[j],
      copy[i]
    ];


  }


  return copy;


}



/* =========================
   GENERATE
========================= */


function generate() {


  const wanted =

    Number(

      document
        .getElementById(
          "number"
        )
        .value

    );


  const uniqueArtist =

    document
      .getElementById(
        "uniqueArtist"
      )
      .checked;



  const pool =

    shuffle(

      getFilteredSongs()

    );



  const chosen = [];

  const usedArtists =
    new Set();



  for (
    const song of pool
  ) {


    if (

      uniqueArtist &&

      usedArtists.has(
        song.artist
      )

    )

      continue;



    chosen.push(song);


    usedArtists.add(
      song.artist
    );



    if (
      chosen.length >= wanted
    )

      break;


  }



  currentLineup =
    chosen;


  displayLineup();


}



/* =========================
   DISPLAY LINEUP
========================= */


function displayLineup() {


  const results =

    document
      .getElementById(
        "results"
      );


  results.innerHTML = "";



  if (
    !currentLineup.length
  ) {


    results.innerHTML =

      "<p>No songs match your filters.</p>";


    return;

  }



  const threeActs =

    document
      .getElementById(
        "threeActs"
      )
      .checked;



  const actSize =

    Math.ceil(

      currentLineup.length
      /
      3

    );



  currentLineup

    .forEach(

      (song,index) => {


        if (

          threeActs &&

          index % actSize === 0

        ) {


          const act =

            Math.floor(

              index
              /
              actSize

            )

            + 1;


          results.innerHTML +=

            `<div class="act">
              ACT ${act}
            </div>`;

        }



        results.innerHTML += `

          <div class="song">

            <div class="song-title">

              ${index + 1}.
              ${song.song}

            </div>


            <div class="song-info">

              ${song.artist || ""}

              ${
                song.year
                  ? " · " + song.year
                  : ""
              }

              ${
                song.speed !== null &&
                song.speed !== undefined

                  ? " · Speed "
                    + song.speed

                  : ""
              }

              ${
                song.tier

                  ? " · "
                    + song.tier

                  : ""
              }

              ${
                song.tag

                  ? " · "
                    + song.tag

                  : ""
              }

            </div>

          </div>

        `;


      }

    );


}



/* =========================
   SEARCH
========================= */


function searchLibrary() {


  const query =

    document
      .getElementById(
        "search"
      )
      .value

      .toLowerCase()

      .trim();



  const output =

    document
      .getElementById(
        "searchResults"
      );


  output.innerHTML = "";



  if (!query)
    return;



  const matches =

    songs

      .filter(song => {


        const songName =

          (song.song || "")
            .toLowerCase();


        const artistName =

          (song.artist || "")
            .toLowerCase();


        return (

          songName
            .includes(query)

          ||

          artistName
            .includes(query)

        );


      })

      .slice(
        0,
        100
      );



  matches.forEach(song => {


    output.innerHTML += `

      <div class="song">

        <div class="song-title">

          ${song.song}

        </div>


        <div class="song-info">

          ${song.artist || ""}

          ${
            song.year
              ? " · " + song.year
              : ""
          }

          ${
            song.speed !== null &&
            song.speed !== undefined

              ? " · Speed "
                + song.speed

              : ""
          }

          ${
            song.tier

              ? " · "
                + song.tier

              : ""
          }

          ${
            song.tag

              ? " · "
                + song.tag

              : ""
          }

        </div>

      </div>

    `;


  });


}



/* =========================
   COPY LIST
========================= */


function copyList() {


  if (
    !currentLineup.length
  )

    return;



  const text =

    currentLineup

      .map(

        (song,index) =>

          `${index + 1}. ${song.song} — ${song.artist}`

      )

      .join("\n");



  navigator
    .clipboard
    .writeText(text)

    .then(() => {

      alert(
        "Lineup copied!"
      );

    })

    .catch(() => {

      alert(
        "Unable to copy lineup."
      );

    });


}



/* =========================
   SERVICE WORKER
========================= */


if (
  "serviceWorker"
  in navigator
) {


  window
    .addEventListener(

      "load",

      () => {


        navigator
          .serviceWorker
          .register(
            "sw.js"
          )

          .catch(error => {

            console.log(
              "Service worker:",
              error
            );

          });


      }

    );


}


</script>


</body>
</html>
